name: TaxiCheck public demo Playwright QA

on:
  push:
    branches: [main]
    paths:
      - index.html
      - tests/browser/taxicheck_github_pages_smoke.py
      - .github/workflows/taxicheck-pages-playwright.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxicheck-public-demo-qa-20261102-layout
  cancel-in-progress: true

jobs:
  mobile-smoke:
    name: Published site · Chromium mobile (402 / 375 px)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TAXICHECK_PAGES_URL: https://kizer-gpt.github.io/TaxiCheckTestPage/
    steps:
      - name: Check out public demo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.64.1
          python -m playwright install --with-deps chromium

      - name: Wait until GitHub Pages serves this exact HTML revision
        env:
          PAGES_URL: ${{ env.TAXICHECK_PAGES_URL }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import time
          from urllib.request import Request, urlopen

          expected = hashlib.sha256(open("index.html", "rb").read()).hexdigest()
          base = os.environ["PAGES_URL"]
          revision = os.environ["GITHUB_SHA"]
          print("Expected HTML SHA256:", expected, flush=True)
          for attempt in range(1, 31):
              address = f"{base}?qa_revision={revision}&attempt={attempt}"
              req = Request(address, headers={
                  "User-Agent": "TaxiCheck-Public-Playwright/1.0",
                  "Cache-Control": "no-cache",
                  "Pragma": "no-cache",
              })
              try:
                  with urlopen(req, timeout=15) as response:
                      data = response.read()
                      actual = hashlib.sha256(data).hexdigest()
                      print(f"Pages check {attempt}: HTTP {response.status}; SHA256 {actual}", flush=True)
                      if response.status == 200 and actual == expected:
                          print("Verified: live GitHub Pages serves the commit's exact HTML", flush=True)
                          break
              except Exception as exc:
                  print(f"Pages check {attempt}: {type(exc).__name__}: {exc}", flush=True)
              time.sleep(10)
          else:
              raise SystemExit("GitHub Pages did not publish the checked-out HTML revision")
          PY

      - name: Playwright mobile smoke against live GitHub Pages
        run: python tests/browser/taxicheck_github_pages_smoke.py

      - name: Upload screenshots and JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxicheck-public-pages-playwright
          path: playwright-artifacts/
          if-no-files-found: warn
          retention-days: 7
